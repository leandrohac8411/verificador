# Verificação mensal de links do sítio do IPEDF
# Roda no dia 1 de cada mês às 07h de Brasília (10h UTC; o cron do GitHub é sempre em UTC).
# Também pode ser executado manualmente em Actions > Verificar links > Run workflow.
#
# O histórico (historico.json + CSV de quebrados dos últimos meses) fica na branch
# "historico", para alimentar o gráfico de evolução e a marcação de links "novos".

name: Verificar links

on:
  schedule:
    - cron: "0 10 1 * *"
  workflow_dispatch:

permissions:
  contents: write          # gravar o histórico (branch "historico") e o index.html (main)

concurrency:
  group: verificar-links
  cancel-in-progress: false

jobs:
  verificar-links:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restaurar histórico
        run: |
          HIST="$RUNNER_TEMP/historico"
          if git ls-remote --exit-code --heads origin historico >/dev/null; then
            git fetch --depth=1 origin historico
            git worktree add -B historico "$HIST" FETCH_HEAD
          else
            echo "Branch 'historico' ainda não existe; esta será a 1ª execução registrada."
            git worktree add --orphan -b historico "$HIST"
          fi
          mkdir -p relatorios
          cp "$HIST"/historico.json "$HIST"/links_quebrados_*.csv relatorios/ 2>/dev/null || true
          ls -l relatorios

      - name: Verificar links
        # 1 = encontrou links quebrados (não é falha do job); 2 = sítio inacessível
        run: |
          python verifica_links.py --saida relatorios --max-paginas 3000 || [ $? -eq 1 ]

      - name: Salvar histórico
        # só quando a verificação terminou bem (sítio inacessível não entra no histórico)
        if: success()
        run: |
          HIST="$RUNNER_TEMP/historico"
          cp relatorios/historico.json "$HIST"/
          cp relatorios/links_quebrados_*.csv "$HIST"/
          cd "$HIST"
          # mantém só os CSVs dos 2 meses mais recentes
          ls links_quebrados_*.csv | sort | head -n -2 | xargs -r rm --
          git add -A
          if git diff --cached --quiet; then
            echo "Histórico sem alterações."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Histórico da verificação de $(date -u +%Y-%m-%d)"
          git push origin historico

      - name: Publicar painel (index.html para a Vercel)
        # o push na main dispara o deploy automático da Vercel
        if: success()
        run: |
          cp relatorios/painel_links_atual.html index.html
          git add index.html
          if git diff --cached --quiet; then
            echo "Painel sem alterações."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Painel de links de $(date -u +%Y-%m)"
          git push origin HEAD:main

      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: links-${{ github.run_number }}
          path: relatorios/
          retention-days: 90
